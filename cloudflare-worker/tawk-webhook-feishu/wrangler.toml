name = "tawk-webhook-feishu"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Environment Variables
# Set these in Cloudflare Dashboard or via wrangler:
#   wrangler secret put FEISHU_WEBHOOK_URL
#   wrangler secret put TAWK_WEBHOOK_SECRET
#   wrangler secret put NOTIFICATION_LANG

[vars]
NOTIFICATION_LANG = "zh"

# After deployment, your worker URL will be:
# https://tawk-webhook-feishu.<your-subdomain>.workers.dev
# Use this URL as the Tawk.to webhook endpoint
