name = "tawk-webhook-feishu"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Environment Variables — set via wrangler secret or Cloudflare Dashboard:
#   wrangler secret put FEISHU_APP_ID
#   wrangler secret put FEISHU_APP_SECRET
#   wrangler secret put FEISHU_CHAT_ID
#   wrangler secret put TAWK_WEBHOOK_SECRET

[vars]
NOTIFICATION_LANG = "zh"

# After deployment, your worker URL will be:
# https://tawk-webhook-feishu.<your-subdomain>.workers.dev
# Use this URL as the Tawk.to webhook endpoint
